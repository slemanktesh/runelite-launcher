name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - run: choco install innosetup --version 6.6.1 --allow-downgrade
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
        cache: gradle
    - name: build detours x64
      shell: cmd
      run: |
        call ci\msvc-env.cmd x64
        cd liblauncher\detours\src
        nmake
    - name: build detours x86
      shell: cmd
      run: |
        call ci\msvc-env.cmd x86
        cd liblauncher\detours\src
        nmake
    - name: build detours aarch64
      shell: cmd
      run: |
        call ci\msvc-env.cmd amd64_arm64
        cd liblauncher\detours\src
        nmake
    - name: build launcher
      run: ./gradlew build -P RUNELITE_BUILD=runelite --no-daemon
    - name: x64 installer
      shell: cmd
      run: |
        call ci\msvc-env.cmd x64
        bash ./build-win64.sh
    - name: x86 installer
      shell: cmd
      run: |
        call ci\msvc-env.cmd x86
        bash ./build-win32.sh
    - name: AArch64 installer
      shell: cmd
      run: |
        call ci\msvc-env.cmd amd64_arm64
        bash ./build-win-aarch64.sh
    - name: stage website downloads
      shell: cmd
      run: |
        if not exist build\website-downloads mkdir build\website-downloads
        copy /Y AlegesSetup.exe build\website-downloads\aleges-windows-x64.exe
        copy /Y AlegesSetup32.exe build\website-downloads\aleges-windows-x86.exe
        copy /Y AlegesSetupAArch64.exe build\website-downloads\aleges-windows-arm64.exe
    - uses: actions/upload-artifact@v7
      with:
        name: website-windows
        path: |
          build/website-downloads/aleges-windows-x64.exe
          build/website-downloads/aleges-windows-x86.exe
          build/website-downloads/aleges-windows-arm64.exe
        if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    container:
      image: amd64/ubuntu:20.04
      options: --privileged
    steps:
    - run: apt update
    - run: DEBIAN_FRONTEND=noninteractive apt install -y gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu g++ cmake git curl fuse file
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
        cache: gradle
    - name: build
      run: ./gradlew build -P RUNELITE_BUILD=runelite
    - run: ./build-linux-x86_64.sh
    - run: ./build-linux-aarch64.sh
    - name: stage website downloads
      run: |
        mkdir -p build/website-downloads
        cp build/libs/Aleges.jar build/website-downloads/aleges-client.jar
        cp Aleges.AppImage build/website-downloads/aleges-linux-x64.AppImage
        cp Aleges-aarch64.AppImage build/website-downloads/aleges-linux-aarch64.AppImage
    - uses: actions/upload-artifact@v7
      with:
        name: website-linux
        path: |
          build/website-downloads/aleges-client.jar
          build/website-downloads/aleges-linux-x64.AppImage
          build/website-downloads/aleges-linux-aarch64.AppImage
        if-no-files-found: error
  macos:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin
        cache: gradle
    - name: build
      run: ./gradlew build -P RUNELITE_BUILD=runelite
    - name: macos-x64
      run: ./build-osx-x64.sh --build --dmg
    - name: macos-aarch64
      run: ./build-osx-aarch64.sh --build --dmg
    # tar app to keep permissions correct
    - name: stage website downloads
      run: |
        mkdir -p build/website-downloads
        tar -cf build/website-downloads/aleges-macos-app.tar build/macos-x64/Aleges.app build/macos-aarch64/Aleges.app build-osx-x64.sh build-osx-aarch64.sh osx/signing.entitlements osx/runelite.icns tools/create-dmg
        cp Aleges-x64.dmg build/website-downloads/aleges-macos-intel.dmg
        cp Aleges-aarch64.dmg build/website-downloads/aleges-macos-apple-silicon.dmg
    - uses: actions/upload-artifact@v7
      with:
        name: website-macos
        path: |
          build/website-downloads/aleges-macos-intel.dmg
          build/website-downloads/aleges-macos-apple-silicon.dmg
          build/website-downloads/aleges-macos-app.tar
        if-no-files-found: error
  website-release:
    needs: [windows, linux, macos]
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        pattern: website-*
        path: build/website-release-input
        merge-multiple: true
    - name: assemble website release
      shell: pwsh
      run: |
        ./ci/prepare-website-release.ps1 `
          -ArtifactsDirectory build/website-release-input `
          -OutputDirectory build/website-release
    - name: validate website release
      shell: pwsh
      run: |
        ./ci/prepare-website-release.ps1 `
          -OutputDirectory build/website-release `
          -ValidateOnly
    - uses: actions/upload-artifact@v7
      with:
        name: website-release
        path: build/website-release
        if-no-files-found: error
